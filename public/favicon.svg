<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #f8f8f2; }
    .border { stroke: #2d6a4f; fill: none; }
    .prompt { fill: #2d6a4f; font-family: ui-monospace, 'JetBrains Mono', Menlo, monospace; font-weight: 700; }
    .caret { fill: #2d6a4f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f10; }
      .border { stroke: #a6e3a1; }
      .prompt { fill: #a6e3a1; }
      .caret { fill: #a6e3a1; }
    }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .caret { animation: blink 1.06s steps(2, end) infinite; }
  </style>
  <rect class="bg" x="0" y="0" width="64" height="64" rx="6" />
  <rect class="border" x="4.5" y="4.5" width="55" height="55" rx="4" stroke-width="2.5" />
  <text class="prompt" x="14" y="42" font-size="28">$</text>
  <rect class="caret" x="36" y="22" width="14" height="20" />
</svg>
